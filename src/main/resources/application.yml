spring:
  application:
    name: dosys-platform-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:dosysdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: DOSYS_DEV_SECRET_CHANGE_THIS_TO_A_LONG_SECURE_SECRET_123456
    expiration: 86400000
  edge:
    service-key: ${EDGE_SERVICE_KEY:dosys-local-edge-service-key-change-me-2026}
